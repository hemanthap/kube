---
apiVersion: v1
kind: Pod
metadata:
  name: fireflyiii
  labels:
    app: fireflyiii
spec:
  restartPolicy: Always
  initContainers:
    - name: init-firefly-permissions
      image: docker.io/library/alpine:3.20
      command:
        - /bin/sh
        - -c
        - chown -R 33:33 /var/www/html/storage
      volumeMounts:
        - mountPath: /var/www/html/storage
          name: fireflyiii-storage
  containers:
    - name: fireflyiii
      image: docker.io/fireflyiii/core:latest
      env:
        - name: APP_ENV
          value: "local"
        - name: APP_DEBUG
          value: "false"
        - name: APP_KEY
          value: "${FIREFLY_APP_KEY}"
        - name: APP_URL
          value: "http://fireflyiii.home"
        - name: TZ
          value: "America/New_York"
        - name: DB_CONNECTION
          value: "pgsql"
        - name: DB_HOST
          value: "${POSTGRES_HOST}"
        - name: DB_PORT
          value: "${POSTGRES_PORT}"
        - name: DB_DATABASE
          value: "${FIREFLY_DB_NAME}"
        - name: DB_USERNAME
          value: "${POSTGRES_USER}"
        - name: DB_PASSWORD
          value: "${POSTGRES_PASSWORD}"
        - name: TRUSTED_PROXIES
          value: "**"
        - name: STATIC_CRON_TOKEN
          value: "${FIREFLY_CRON_TOKEN}"
      ports:
        - containerPort: 8080
          hostPort: 9600
      volumeMounts:
        - mountPath: /var/www/html/storage
          name: fireflyiii-storage
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

  volumes:
    - name: fireflyiii-storage
      hostPath:
        path: ${PERSISTENT_PATH}/fireflyiii
        type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: fireflyiii
  labels:
    app: fireflyiii
spec:
  selector:
    app: fireflyiii
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fireflyiii-cron
spec:
  # Runs every 30 minutes so a single missed window doesn't cost a whole
  # cycle of recurring transactions, bills, or budgets.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: fireflyiii-cron
              image: docker.io/curlimages/curl:latest
              env:
                - name: FIREFLY_CRON_TOKEN
                  value: "${FIREFLY_CRON_TOKEN}"
              command:
                - /bin/sh
                - -c
                - "curl -fsS http://fireflyiii.home/api/v1/cron/${FIREFLY_CRON_TOKEN}"
apiVersion: v1
kind: Pod
metadata:
  name: go2rtc
  labels:
    app: go2rtc
spec:
  restartPolicy: Always
  containers:
    - name: go2rtc
      image: docker.io/alexxit/go2rtc:1.9.4
      ports:
        - containerPort: 1984
          hostPort: 1984
        - containerPort: 8554
          hostPort: 8554
        - containerPort: 8555
          hostPort: 8555
          protocol: UDP
      volumeMounts:
        - name: config
          mountPath: /config
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /
          port: 1984
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /
          port: 1984
        initialDelaySeconds: 5
        periodSeconds: 10
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: config
      hostPath:
        path: ${PERSISTENT_PATH}/go2rtc/config
        type: DirectoryOrCreate
    - name: tmp
      emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
    name: jdk-ssh-config
data:
    sshd_config: |
        Port 22
        PermitRootLogin no
        PasswordAuthentication yes
        PubkeyAuthentication yes
        AuthorizedKeysFile .ssh/authorized_keys
        X11Forwarding no
        PrintMotd no
        AcceptEnv LANG LC_*
        Subsystem sftp /usr/lib/openssh/sftp-server
    setup.sh: |
        #!/bin/sh
        set -ex

        # Install packages
        apk add --no-cache \
          openjdk25 openssh openssh-client sudo curl git wget \
          python3 py3-pip ca-certificates icu-libs libssl3 zlib \
          coreutils bash dotnet8-sdk

        # Install Maven. Prefer Alpine package to avoid long external archive downloads.
        if ! apk add --no-cache maven; then
          MVN_VERSION=3.9.8
          curl -fL --connect-timeout 15 --max-time 180 \
            "https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz" \
            -o /tmp/maven.tar.gz
          tar -xzf /tmp/maven.tar.gz -C /opt
          ln -sf /opt/apache-maven-${MVN_VERSION} /opt/maven
          rm -f /tmp/maven.tar.gz
        fi

        # Setup environment
        JAVA_HOME=$(find /usr/lib/jvm -name "java-*-openjdk" -type d | head -1)
        mkdir -p /etc/profile.d
        echo "export JAVA_HOME=$JAVA_HOME" > /etc/profile.d/devenv.sh
        if command -v mvn >/dev/null 2>&1; then
          MVN_BIN=$(command -v mvn)
          MVN_DIR=$(dirname "$(dirname "$MVN_BIN")")
          echo "export MAVEN_HOME=$MVN_DIR" >> /etc/profile.d/devenv.sh
        else
          echo "export MAVEN_HOME=/opt/maven" >> /etc/profile.d/devenv.sh
        fi
        echo "export DOTNET_ROOT=/usr/lib/dotnet" >> /etc/profile.d/devenv.sh
        echo 'export PATH=$JAVA_HOME/bin:/opt/maven/bin:$DOTNET_ROOT:$PATH' >> /etc/profile.d/devenv.sh
        chmod +x /etc/profile.d/devenv.sh

        # Create dev user
        addgroup dev || true
        adduser -D -G dev -s /bin/sh -h /home/dev dev || true
        mkdir -p /home/dev
        echo "dev:Dev123!" | chpasswd  # Set password for dev user

        # Setup SSH
        mkdir -p /home/dev/.ssh /run/sshd
        ssh-keygen -A  # Generate SSH host keys
        [ -f /etc/jdk-setup/sshd_config ] && cp /etc/jdk-setup/sshd_config /etc/ssh/sshd_config
        [ -n "$DEV_SSH_PUBLIC_KEY" ] && echo "$DEV_SSH_PUBLIC_KEY" > /home/dev/.ssh/authorized_keys
        chmod 700 /home/dev/.ssh 2>/dev/null || true
        [ -f /home/dev/.ssh/authorized_keys ] && chmod 600 /home/dev/.ssh/authorized_keys
        chown -R dev:dev /home/dev 2>/dev/null || true

        # Install VS Code remote extensions if a compatible CLI is available.
        install_exts() {
          cli="$1"
          su dev -c "$cli --install-extension vscjava.vscode-java-pack --force" || true
          su dev -c "$cli --install-extension vscjava.vscode-maven --force" || true
          su dev -c "$cli --install-extension ms-python.python --force" || true
          su dev -c "$cli --install-extension ms-dotnettools.csharp --force" || true
          su dev -c "$cli --install-extension ms-dotnettools.vscode-dotnet-runtime --force" || true
        }

        if command -v code >/dev/null 2>&1; then
          install_exts "code"
        fi

        for cli in /home/dev/.vscode-server/bin/*/bin/code-server; do
          [ -x "$cli" ] || continue
          install_exts "$cli"
        done

        # Start SSH
        exec /usr/sbin/sshd -D
---
apiVersion: v1
kind: Pod
metadata:
    name: jdk
    labels:
        app: jdk
spec:
    restartPolicy: Always
    containers:
        - name: jdk
          image: alpine:latest
          command: ["/bin/sh", "/etc/jdk-setup/setup.sh"]
          env:
              - name: DEV_SSH_PUBLIC_KEY
                value: "${DEV_SSH_PUBLIC_KEY}"
          ports:
              - containerPort: 22
                hostPort: 4422
          volumeMounts:
              - mountPath: /home/dev/projects
                name: jdk-workspace
              - mountPath: /etc/jdk-setup
                name: jdk-ssh-config
    volumes:
        - name: jdk-workspace
          hostPath:
              path: ${PERSISTANT_PATH}/jdk
              type: DirectoryOrCreate
        - name: jdk-ssh-config
          configMap:
              name: jdk-ssh-config
              defaultMode: 0755
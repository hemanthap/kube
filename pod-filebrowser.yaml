apiVersion: v1
kind: Pod
metadata:
  name: filebrowser
  labels:
    app: filebrowser
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
  restartPolicy: Always
  containers:
    - name: filebrowser
      image: gtstef/filebrowser:stable
      env:
        - name: FILEBROWSER_DATABASE
          value: /database/filebrowser.db
        - name: FILEBROWSER_CONFIG
          value: /srv/dockerdata/filebrowser/config.yaml
      ports:
        - name: http
          containerPort: 80
          hostPort: 7000
          protocol: TCP
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
      livenessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
      volumeMounts:
        - name: admin
          mountPath: /srv/admin
        - name: dockerdata
          mountPath: /srv/dockerdata
        - name: config
          mountPath: /config
        - name: database
          mountPath: /database
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /srv/.uploads
  volumes:
    - name: admin
      hostPath:
        path: /home/admin
        type: Directory
    - name: dockerdata
      hostPath:
        path: /srv/dockerdata
        type: Directory
    - name: config
      hostPath:
        path: ${PERSISTENT_PATH}/filebrowser/config
        type: DirectoryOrCreate
    - name: database
      hostPath:
        path: ${PERSISTENT_PATH}/filebrowser/database
        type: DirectoryOrCreate
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
    - name: uploads
      emptyDir:
        sizeLimit: 5Gi
  dnsPolicy: ClusterFirst
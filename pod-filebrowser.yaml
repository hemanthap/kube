apiVersion: v1
kind: Pod
metadata:
  name: filebrowser
  labels:
    app: filebrowser
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
  restartPolicy: Always
  containers:
    - name: filebrowser
      image: filebrowser/filebrowser:v2.31.2
      args:
        - "--config"
        - "/config/filebrowser.json"
        - "--address"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "--database"
        - "/database/filebrowser.db"
      ports:
        - name: http
          containerPort: 8080
          hostPort: 7000
          protocol: TCP
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      volumeMounts:
        - name: admin
          mountPath: /srv/admin
        - name: dockerdata
          mountPath: /srv/dockerdata
        - name: config
          mountPath: /config
        - name: database
          mountPath: /database
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /srv/.uploads
  volumes:
    - name: admin
      hostPath:
        path: /home/admin
        type: Directory
    - name: dockerdata
      hostPath:
        path: /srv/dockerdata
        type: Directory
    - name: config
      hostPath:
        path: ${PERSISTENT_PATH}/filebrowser/config
        type: DirectoryOrCreate
    - name: database
      hostPath:
        path: /var/lib/filebrowser/database
        type: DirectoryOrCreate
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
    - name: uploads
      emptyDir:
        sizeLimit: 5Gi
  dnsPolicy: ClusterFirst
apiVersion: v1
kind: Pod
metadata:
    name: homarr
spec:
    restartPolicy: Always

    containers:
        - name: homarr
          image: ghcr.io/ajnart/homarr:latest
          imagePullPolicy: IfNotPresent
          env:
              - name: NEXTAUTH_URL
                value: "http://lab.home"
              - name: BASE_URL
                value: "http://lab.home"
              - name: HOSTNAME
                value: "0.0.0.0"
              - name: DISABLE_UPGRADE_MODAL
                value: "true"
          ports:
              - containerPort: 7575
                hostPort: 7575
                protocol: TCP
          volumeMounts:
              - name: homarr-data
                mountPath: /app/data/configs
              - name: homarr-data
                mountPath: /app/public/icons
              - name: homarr-data
                mountPath: /data
          resources:
              requests:
                  memory: "128Mi"
                  cpu: "100m"
              limits:
                  memory: "512Mi"
                  cpu: "500m"
          livenessProbe:
              tcpSocket:
                port: 7575
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readinessProbe:
              tcpSocket:
                port: 7575
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          startupProbe:
              tcpSocket:
                port: 7575
              # Allow up to 5 minutes for cold starts before liveness kicks in.
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                  drop: ["ALL"]

    volumes:
        - name: homarr-data
          hostPath:
              path: ${PERSISTENT_PATH}/homarr
              type: DirectoryOrCreate

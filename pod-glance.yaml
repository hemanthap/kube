                        icon: mdi:server
                      - title: Tailscale
                        url: http://tailscale.home
                        icon: mdi:vpn
                      - title: ntfy
                        url: http://ntfy.home
                        icon: mdi:bell-ring-outline
                      - title: Headlamp
                        url: http://headlamp.home
                        icon: di:headlamp
                      - title: Dozzle
                        url: http://dozzle.home
                        icon: di:dozzle

apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
data:
  glance.yml: |
    server:
      host: 0.0.0.0
      port: 8080

    branding:
      app-name: Home-Lab Dashboard
      hide-footer: false

    theme:
      background-color: 0 0 0
      primary-color: 0 0 75
      positive-color: 140 45 45
      negative-color: 0 65 60
      contrast-multiplier: 1.1
      disable-picker: true

    pages:
      - name: Home
        width: wide
        show-mobile-header: true
        columns:
          - size: small
            widgets: &left-sidebar-widgets
              - type: search
                search-engine: duckduckgo
                autofocus: true

              - type: calendar
                first-day-of-week: monday

              - type: clock
                hour-format: 12h
                timezones:
                  - timezone: Asia/Kolkata
                    label: Bangalore

          - size: full
            widgets:
              - type: bookmarks
                style: cards
                groups:
                  - &grp-security
                    title: Security
                    color: "0 70 55"
                    links:
                      - title: Camera — Basement
                        url: http://go2rtc.home/stream.html?src=tapo_camera_basement
                        icon: di:go2rtc
                      - title: Camera — Living Room
                        url: http://go2rtc.home/stream.html?src=tapo_camera_livingroom
                        icon: di:go2rtc
                      - title: go2rtc
                        url: http://go2rtc.home
                        icon: di:go2rtc
                  - &grp-media
                    title: Media
                    color: "270 55 65"
                    links:
                      - title: FreshRSS
                        url: http://freshrss.home
                        icon: di:freshrss
                      - title: Immich
                        url: http://immich.home
                        icon: di:immich
                      - title: Navidrome
                        url: http://navidrome.home
                        icon: di:navidrome
                      - title: ownCloud
                        url: http://owncloud.home
                        icon: di:owncloud
                  - &grp-productivity
                    title: Productivity
                    color: "160 55 45"
                    links:
                      - title: Actual Budget
                        url: http://budget.home
                        icon: di:actual-budget
                      - title: AgenDAV Calendar
                        url: http://agendav.home
                        icon: mdi:calendar
                      - title: BentoPDF
                        url: http://bentopdf.home
                        icon: di:bentopdf
                      - title: Linkding
                        url: http://linkding.home
                        icon: di:linkding
                      - title: Memos
                        url: http://memos.home
                        icon: di:memos
                  - &grp-development
                    title: Development
                    color: "200 70 55"
                    links:
                      - title: n8n
                        url: http://n8n.home
                        icon: di:n8n
                      - title: Ollama
                        url: http://192.168.68.101:3000
                        icon: di:ollama
                      - title: pgAdmin
                        url: http://pgadmin.home
                        icon: di:pgadmin
                      - title: Qdrant
                        url: http://qdrant.home/dashboard
                        icon: di:qdrant
                      - title: RedisInsight
                        url: http://redisinsight.home
                        icon: di:redis
                  # Note: unified so this group is identical on every page —
                  # the old config had "File Browser" here but "Baikal Admin"
                  # only on the separate Admin & Network page. Now both appear
                  # everywhere.
                  - &grp-admin
                    title: Admin & Network
                    color: "35 80 55"
                    links:
                      - title: Baikal Admin
                        url: http://baikal.home/admin
                        icon: di:baikal
                      - title: Dozzle
                        url: http://dozzle.home
                        icon: di:dozzle
                      - title: File Browser
                        url: http://filebrowser.home
                        icon: di:filebrowser
                      - title: Headlamp
                        url: http://headlamp.home
                        icon: di:headlamp
                      - title: ntfy
                        url: http://ntfy.home
                        icon: mdi:bell-ring-outline
                      - title: Server Dashboard
                        url: http://lab.home:9090
                        icon: mdi:server
                      - title: Tailscale
                        url: http://tailscale.home
                        icon: mdi:vpn
                      - title: Technitium DNS
                        url: http://technitium.home
                        icon: di:technitium

      - name: Home Security
        width: wide
        show-mobile-header: true
        columns:
          - size: small
            widgets: *left-sidebar-widgets
          - size: full
            widgets:
              - type: bookmarks
                style: cards
                groups:
                  - *grp-security

      - name: Media
        width: wide
        show-mobile-header: true
        columns:
          - size: small
            widgets: *left-sidebar-widgets
          - size: full
            widgets:
              - type: bookmarks
                style: cards
                groups:
                  - *grp-media

      - name: Productivity
        width: wide
        show-mobile-header: true
        columns:
          - size: small
            widgets: *left-sidebar-widgets
          - size: full
            widgets:
              - type: bookmarks
                style: cards
                groups:
                  - *grp-productivity

      - name: Development
        width: wide
        show-mobile-header: true
        columns:
          - size: small
            widgets: *left-sidebar-widgets
          - size: full
            widgets:
              - type: bookmarks
                style: cards
                groups:
                  - *grp-development
              # CPU / memory / disk / network for the host running these
              # dev services. Requires hostPath mounts of /proc and /sys
              # (see the Pod spec below) — remove this widget if you'd
              # rather not grant that access.
              - type: server-stats
                servers:
                  - type: local
                    name: lab-server

      - name: Admin & Network
        width: wide
        show-mobile-header: true
        columns:
          - size: small
            widgets: *left-sidebar-widgets
          - size: full
            widgets:
              - type: bookmarks
                style: cards
                groups:
                  - *grp-admin

---
apiVersion: v1
kind: Pod
metadata:
  name: glance
spec:
  restartPolicy: Always
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 192.168.68.50
      - 10.43.0.10
    searches:
      - default.svc.cluster.local
      - svc.cluster.local
      - cluster.local
  containers:
    - name: glance
      image: glanceapp/glance:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          hostPort: 8585
          protocol: TCP
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      volumeMounts:
        - name: glance-config
          mountPath: /app/config/glance.yml
          subPath: glance.yml
        - name: glance-data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
        # Only needed if you keep the server-stats widget above.
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
  volumes:
    - name: glance-config
      configMap:
        name: glance-config
    - name: glance-data
      hostPath:
        path: ${PERSISTENT_PATH}/glance
        type: DirectoryOrCreate
    - name: tmp
      emptyDir: {}
    - name: proc
      hostPath:
        path: /proc
        type: Directory
    - name: sys
      hostPath:
        path: /sys
        type: Directory
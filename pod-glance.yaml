apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
data:
  glance.yml: |
    server:
      host: 0.0.0.0
      port: 8080

    branding:
      app-name: Home-Lab Dashboard
      hide-footer: false

    theme:
      background-color: 0 0 0
      primary-color: 0 0 75
      positive-color: 140 45 45
      negative-color: 0 65 60
      contrast-multiplier: 1.1
      disable-picker: true

    pages:
      - name: Home
        width: wide
        show-mobile-header: true
        columns:
          - size: small
            widgets: &left-sidebar-widgets
              - type: search
                search-engine: duckduckgo
                autofocus: true

              # - type: weather
              #   title: Basking Ridge
              #   location: Basking Ridge, New Jersey, United States
              #   units: imperial
              #   hour-format: 12h

              - type: calendar
                first-day-of-week: monday

              - type: clock
                hour-format: 12h
                timezones:
                  - timezone: Asia/Kolkata
                    label: Bangalore
                  - timezone: America/New_York
                    label: Basking Ridge

          - size: full
            widgets:
              - type: bookmarks
                groups:
                  - title: Security
                    links:
                      - title: go2rtc
                        url: http://go2rtc.home
                        icon: di:go2rtc
                      - title: Camera — Living Room
                        url: http://go2rtc.home/stream.html?src=tapo_camera_livingroom
                        icon: di:go2rtc
                      - title: Camera — Basement
                        url: http://go2rtc.home/stream.html?src=tapo_camera_basement
                        icon: di:go2rtc
                  - title: Media
                    links:
                      - title: Navidrome
                        url: http://navidrome.home
                        icon: di:navidrome
                      - title: Immich
                        url: http://immich.home
                        icon: di:immich
                      - title: ownCloud
                        url: http://owncloud.home
                        icon: di:owncloud
                      - title: FreshRSS
                        url: http://freshrss.home
                        icon: di:freshrss
                  - title: Productivity
                    links:
                      - title: Memos
                        url: http://memos.home
                        icon: di:memos
                      - title: BentoPDF
                        url: http://bentopdf.home
                        icon: di:bentopdf
                      - title: AgenDAV Calendar
                        url: http://agendav.home
                        icon: mdi:calendar
                      - title: Linkding
                        url: http://linkding.home
                        icon: di:linkding
                      - title: Actual Budget
                        url: http://budget.home
                        icon: di:actual-budget
                  - title: Development
                    links:
                      - title: n8n
                        url: http://n8n.home
                        icon: di:n8n
                      - title: Ollama
                        url: http://192.168.68.101:3000
                        icon: di:ollama
                      - title: pgAdmin

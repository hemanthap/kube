---
apiVersion: v1
kind: Pod
metadata:
  name: glance
spec:
  restartPolicy: Always
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 192.168.68.50
      - 10.43.0.10
    searches:
      - default.svc.cluster.local
      - svc.cluster.local
      - cluster.local
  containers:
    - name: glance
      image: glanceapp/glance:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          hostPort: 8585
          protocol: TCP
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      volumeMounts:
        - name: glance-config
          mountPath: /app/config/glance.yml
          subPath: glance.yml
        - name: glance-data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: glance-config
      configMap:
        name: glance-config
    - name: glance-data
      hostPath:
        path: ${PERSISTENT_PATH}/glance
        type: DirectoryOrCreate
    - name: tmp
      emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
    name: caddy-config
data:
  Caddyfile: |
    {
      auto_https off
      servers {
        protocols h1
      }
      default_bind 0.0.0.0
    }

    # -------------------------
    # Hostname-based services
    # -------------------------
    http://go2rtc.home {
      reverse_proxy 127.0.0.1:1984
    }
    http://immich.home {
      reverse_proxy 127.0.0.1:2283
    }
    http://ntfy.home {
      reverse_proxy 127.0.0.1:2586
    }
    http://grafana.home {
      reverse_proxy 127.0.0.1:3000
    }
    http://budget.home {
      reverse_proxy 127.0.0.1:5020
    }
    http://jupyter.home {
      reverse_proxy 127.0.0.1:5200
    }
    http://technitium.home {
      reverse_proxy 127.0.0.1:5380
    }
    http://memos.home {
      reverse_proxy 127.0.0.1:5400
    }
    http://pgadmin.home {
      reverse_proxy 127.0.0.1:5433
    }
    http://bentopdf.home {
      reverse_proxy 127.0.0.1:5500
    }
    http://rclone.home {
      reverse_proxy 127.0.0.1:5572
    }
    http://n8n.home {
      reverse_proxy 127.0.0.1:5678
    }
    http://qdrant.home {
      reverse_proxy 127.0.0.1:6333
    }
    http://redisinsight.home {
      reverse_proxy 127.0.0.1:6380
    }
    http://filebrowser.home {
      reverse_proxy 127.0.0.1:7000
    }
    http://headlamp.home {
      reverse_proxy 127.0.0.1:8090
    }
    http://dozzle.home {
      reverse_proxy 127.0.0.1:8095
    }
    http://homeassistant.home {
      reverse_proxy 127.0.0.1:8123
    }
    http://glance.home {
      reverse_proxy 127.0.0.1:8585
    }
    http://linkding.home {
      reverse_proxy 127.0.0.1:9100
    }
    http://navidrome.home {
      reverse_proxy 127.0.0.1:9200
    }
    http://baikal.home {
      reverse_proxy 127.0.0.1:9300
    }
    http://agendav.home {
      reverse_proxy 127.0.0.1:9301
    }
    http://owncloud.home {
      reverse_proxy 127.0.0.1:9400
    }
    http://freshrss.home {
      reverse_proxy 127.0.0.1:9500
    }
    http://ollamallm.home {
      reverse_proxy 127.0.0.1:11434
    }
    http://ollama.home {
      reverse_proxy 127.0.0.1:11435
    }
    http://codeserver.home {
      reverse_proxy 127.0.0.1:30080
    }

    # Homarr — reached via pod-local loopback since it's in the same pod
    http://lab.home {
      reverse_proxy 127.0.0.1:7575 {
        header_up X-Real-IP {remote_host}
      }
    }

    # -------------------------
    # Main router → Homarr
    # -------------------------
    http:// {
      reverse_proxy 127.0.0.1:7575 {
        header_up X-Real-IP {remote_host}
      }
    }


---
apiVersion: v1
kind: Pod
metadata:
    name: caddy-homarr
spec:
    # hostNetwork: true fixes host.containers.internal NXDOMAIN —
    # Caddy now shares the host network and can reach all host-bound services
    # via 127.0.0.1. Port mappings are removed as they conflict with hostNetwork.
    hostNetwork: true
    restartPolicy: Always

    containers:
        - name: caddy
          image: caddy:2.8.4
          imagePullPolicy: IfNotPresent
          # Port 80 bound directly on host via hostNetwork — no mapping needed
          volumeMounts:
              - name: caddy-config
                mountPath: /etc/caddy/Caddyfile
                subPath: Caddyfile
              - name: caddy-tmp
                mountPath: /tmp
          resources:
              requests:
                  memory: "64Mi"
                  cpu: "50m"
              limits:
                  memory: "256Mi"
                  cpu: "500m"
          livenessProbe:
              tcpSocket:
                port: 80
              initialDelaySeconds: 10
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readinessProbe:
              tcpSocket:
                port: 80
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                  drop: ["ALL"]
                  add: ["NET_BIND_SERVICE"]

        - name: homarr
          image: ghcr.io/ajnart/homarr:latest
          imagePullPolicy: IfNotPresent
          env:
              - name: NEXTAUTH_URL
                value: "http://lab.home"
              - name: BASE_URL
                value: "http://lab.home"
              - name: HOSTNAME
                value: "0.0.0.0"
              - name: DISABLE_UPGRADE_MODAL
                value: "true"
          volumeMounts:
              - name: homarr-data
                mountPath: /app/data/configs
              - name: homarr-data
                mountPath: /app/public/icons
              - name: homarr-data
                mountPath: /data
          resources:
              requests:
                  memory: "128Mi"
                  cpu: "100m"
              limits:
                  memory: "512Mi"
                  cpu: "500m"
          livenessProbe:
              tcpSocket:
                port: 7575
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readinessProbe:
              tcpSocket:
                port: 7575
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          startupProbe:
              tcpSocket:
                port: 7575
              # Allow up to 5 minutes for cold starts before liveness kicks in.
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                  drop: ["ALL"]

    volumes:
        - name: caddy-config
          configMap:
              name: caddy-config
        - name: homarr-data
          hostPath:
              path: ${PERSISTENT_PATH}/caddy-homarr
              type: DirectoryOrCreate
        - name: caddy-tmp
          emptyDir: {}

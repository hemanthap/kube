---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: headlamp
  namespace: default
  labels:
    app: headlamp
spec:
  serviceAccountName: headlamp
  restartPolicy: Always
  containers:
    - name: headlamp
      image: ghcr.io/headlamp-k8s/headlamp:latest
      args: ["-in-cluster"]
      ports:
        - containerPort: 4466
          hostPort: 8090
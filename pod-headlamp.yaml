---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-kubeconfig
  namespace: default
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: headlamp-sa
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: main
        context:
          cluster: in-cluster
          user: headlamp-sa
    current-context: main
---
apiVersion: v1
kind: Pod
metadata:
  name: headlamp
  namespace: default
  labels:
    app: headlamp
spec:
  serviceAccountName: headlamp
  restartPolicy: Always
  volumes:
    - name: headlamp-kubeconfig
      configMap:
        name: headlamp-kubeconfig
  containers:
    - name: headlamp
      image: ghcr.io/headlamp-k8s/headlamp:latest
      args: ["-kubeconfig", "/home/headlamp/.config/Headlamp/kubeconfigs/config"]
      volumeMounts:
        - name: headlamp-kubeconfig
          mountPath: /home/headlamp/.config/Headlamp/kubeconfigs/config
          subPath: config
      ports:
        - containerPort: 4466
          hostPort: 8090
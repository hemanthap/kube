---
apiVersion: v1
kind: Pod
metadata:
  name: freshrss
  labels:
    app: freshrss
spec:
  restartPolicy: Always
  containers:
    - name: freshrss
      image: docker.io/freshrss/freshrss:latest
      ports:
        - containerPort: 80
          hostPort: 9500
      env:
        - name: TZ
          value: "UTC"
        - name: CRON_MIN
          value: "*/20"
        - name: DB_TYPE
          value: "pgsql"
        - name: DB_HOST
          value: "host.containers.internal"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "freshrss"
        - name: DB_USER
          value: "${POSTGRES_USER}"
        - name: DB_PASSWORD
          value: "${POSTGRES_PASSWORD}"
      volumeMounts:
        - mountPath: /var/www/FreshRSS/data
          name: freshrss-data
        - mountPath: /var/www/FreshRSS/extensions
          name: freshrss-extensions
  volumes:
    - name: freshrss-data
      hostPath:
        path: ${PERSISTANT_PATH}/freshrss/data
        type: DirectoryOrCreate
    - name: freshrss-extensions
      hostPath:
        path: ${PERSISTANT_PATH}/freshrss/extensions
        type: DirectoryOrCreate

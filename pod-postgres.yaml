apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  restartPolicy: Always
  containers:
    
    - name: postgres
      image: docker.io/pgvector/pgvector:pg14
      env:
        - name: POSTGRES_DB
          value: "postgres"
        - name: PGDATA
          value: "/var/lib/postgresql/data"
        - name: POSTGRES_USER
          value: "${POSTGRES_USER}"
        - name: POSTGRES_PASSWORD
          value: "${POSTGRES_PASSWORD}"
      ports:
        - containerPort: 5432
          hostPort: 5432
      args:
        - "postgres"
        - "-c"
        - "logging_collector=on"
        - "-c"
        - "max_wal_size=2GB"
        - "-c"
        - "shared_buffers=512MB"
        - "-c"
        - "wal_compression=on"
      volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
        - mountPath: /docker-entrypoint-initdb.d
          name: pg-initdb
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "2Gi"
          cpu: "2000m"

          
    - name: pgadmin
      image: dpage/pgadmin4:latest
      ports:
        - containerPort: 80
          hostPort: 5433
      env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: "${PGADMIN_DEFAULT_EMAIL}"
        - name: PGADMIN_DEFAULT_PASSWORD
          value: "${PGADMIN_DEFAULT_PASSWORD}"
        - name: PGADMIN_SETUP_EMAIL
          value: "${PGADMIN_SETUP_EMAIL}"
        - name: PGADMIN_SETUP_PASSWORD
          value: "${PGADMIN_SETUP_PASSWORD}"
        - name: PGADMIN_CONFIG_SERVER_MODE
          value: "False"
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"

    
  volumes:
    - name: pgdata
      hostPath:
        path: ${PERSISTENT_PATH}/postgres
        type: DirectoryOrCreate
    - name: pg-initdb
      configMap:
        name: postgres-initdb
        defaultMode: 0755
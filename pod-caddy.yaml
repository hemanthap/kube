apiVersion: v1
kind: ConfigMap
metadata:
    name: caddy-config
data:
  Caddyfile: |
    {
      auto_https off
      servers {
        protocols h1
      }
      default_bind 0.0.0.0
    }

    # -------------------------
    # Hostname-based services
    # -------------------------
    http://go2rtc.home {
      reverse_proxy 127.0.0.1:1984
    }
    http://immich.home {
      reverse_proxy 127.0.0.1:2283
    }
    http://ntfy.home {
      @ntfy_nocache path / /index.html /manifest.webmanifest /config.js /static/* /sw.js /service-worker.js
      header @ntfy_nocache Cache-Control "no-store, must-revalidate"
      reverse_proxy 127.0.0.1:2586
    }
    http://grafana.home {
      reverse_proxy 127.0.0.1:3000
    }
    http://budget.home {
      reverse_proxy 127.0.0.1:5020
    }
    http://jupyter.home {
      reverse_proxy 127.0.0.1:5200
    }
    http://technitium.home {
      reverse_proxy 127.0.0.1:5380
    }
    http://memos.home {
      reverse_proxy 127.0.0.1:5400
    }
    http://pgadmin.home {
      reverse_proxy 127.0.0.1:5433
    }
    http://bentopdf.home {
      reverse_proxy 127.0.0.1:5500
    }
    http://rclone.home {
      reverse_proxy 127.0.0.1:5572
    }
    http://n8n.home {
      reverse_proxy 127.0.0.1:5678
    }
    http://qdrant.home {
      reverse_proxy 127.0.0.1:6333
    }
    http://redisinsight.home {
      reverse_proxy 127.0.0.1:6380
    }
    http://filebrowser.home {
      reverse_proxy 127.0.0.1:7000
    }
    http://homarr.home {
      reverse_proxy 127.0.0.1:7575
    }
    http://tailscale.home {
      reverse_proxy 127.0.0.1:8088
    }
    http://headlamp.home {
      reverse_proxy 127.0.0.1:8090
    }
    http://dozzle.home {
      reverse_proxy 127.0.0.1:8095
    }
    http://homeassistant.home {
      reverse_proxy 127.0.0.1:8123
    }
    http://duplicati.home {
      reverse_proxy 127.0.0.1:8200
    }
    http://glance.home {
      reverse_proxy 127.0.0.1:8585
    }
    http://linkding.home {
      reverse_proxy 127.0.0.1:9100
    }
    http://navidrome.home {
      reverse_proxy 127.0.0.1:9200
    }
    http://baikal.home {
      reverse_proxy 127.0.0.1:9300
    }
    http://agendav.home {
      reverse_proxy 127.0.0.1:9301
    }
    http://owncloud.home {
      reverse_proxy 127.0.0.1:9400
    }
    http://freshrss.home {
      reverse_proxy 127.0.0.1:9500
    }
    http://fireflyiii.home {
      reverse_proxy 127.0.0.1:9600
    }
    http://ollamallm.home {
      reverse_proxy 127.0.0.1:11434
    }
    http://ollama.home {
      reverse_proxy 127.0.0.1:11435
    }
    http://codeserver.home {
      reverse_proxy 127.0.0.1:30080
    }

    # homepage exposed on host port from a separate pod
    http://lab.home {
      reverse_proxy 127.0.0.1:8585 {
        header_up X-Real-IP {remote_host}
      }
    }

    # -------------------------
    # Main router -> homepage
    # -------------------------
    http:// {
      reverse_proxy 127.0.0.1:8585 {
        header_up X-Real-IP {remote_host}
      }
    }

---
apiVersion: v1
kind: Pod
metadata:
    name: caddy
spec:
    # hostNetwork: true fixes host.containers.internal NXDOMAIN.
    # Caddy shares the host network and can reach host-bound services via 127.0.0.1.
    hostNetwork: true
    restartPolicy: Always

    containers:
        - name: caddy
          image: caddy:2.8.4
          imagePullPolicy: IfNotPresent
          volumeMounts:
              - name: caddy-config
                mountPath: /etc/caddy/Caddyfile
                subPath: Caddyfile
              - name: caddy-tmp
                mountPath: /tmp
          resources:
              requests:
                  memory: "64Mi"
                  cpu: "50m"
              limits:
                  memory: "256Mi"
                  cpu: "500m"
          livenessProbe:
              tcpSocket:
                port: 80
              initialDelaySeconds: 10
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readinessProbe:
              tcpSocket:
                port: 80
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                  drop: ["ALL"]
                  add: ["NET_BIND_SERVICE"]

    volumes:
        - name: caddy-config
          configMap:
              name: caddy-config
        - name: caddy-tmp
          emptyDir: {}

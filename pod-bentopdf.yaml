apiVersion: v1
kind: Pod
metadata:
  name: bentopdf
  labels:
    app: bentopdf
spec:
  restartPolicy: Always
  containers:
    - name: bentopdf
      image: docker.io/bentopdf/bentopdf:latest
      ports:
        - containerPort: 8080
          hostPort: 5500
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - mountPath: /tmp
          name: tmp
  volumes:
    - name: tmp
      emptyDir: {}